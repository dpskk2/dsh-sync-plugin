# awesome-dsh-plugin 收录投稿文件
#
# 用法:把这个文件内容复制到 awesome-dsh-plugin 仓库的
#   data/plugins/dpskk2__dsh-sync-plugin.yml
# 然后发一个 PR(一个 PR 只加这一个文件)。
# 官方指南:https://github.com/awesome-dsh-plugin/awesome-dsh-plugin/blob/main/contributing.md
#
# 最近更新:2026-09-17 —— 统一场景描述；提交前先检查目录中是否已有本条目，已有则更新原文件。
#
# 提交前核对收录前提（以官方指南和实际仓库状态为准）:
#  - package.json 声明了 dsh.bundle manifest(cordis.patch.yml)→ 可用 dsh plugin add 安装 ✓
#  - 仓库有真实可用的代码、创建满 1 天、持续维护 ✓
#  - 记得在 GitHub 仓库设置里添加 topic: dsh-plugin(还有 dsh、deepseek-harness)
#  - 建议:发布到 npm(仓库 package.json 的 repository 已指回本仓库,自动关联)

url: https://github.com/dpskk2/dsh-sync-plugin
name: dpskk2/dsh-sync-plugin
category: session
description:
  en: Pick up on another computer by syncing DSH sessions, attachments, settings and workspace files through your own GitHub repository.
  zh: 换台电脑，接着做：通过自己的 GitHub 仓库同步 DSH 会话、附件、设置和工作区文件，支持手动与自动同步。

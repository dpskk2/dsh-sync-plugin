name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Sanity check tag vs package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version ($TAG) does not match package.json version ($PKG)" >&2
            exit 1
          fi

      - name: Skip if version already on npm (idempotent)
        run: |
          PKG="$(node -p 'require("./package.json").version')"
          if npm view "dsh-sync-plugin@${PKG}" version >/dev/null 2>&1; then
            echo "dsh-sync-plugin@${PKG} 已存在于 npm,跳过发布"
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        if: env.ALREADY_PUBLISHED != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}